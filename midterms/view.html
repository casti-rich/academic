<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @font-face {
            font-family: valo;
            src: url("assets/Valorant Font.ttf");
        }

        body {
            background-color: rgb(0, 24, 14);
        }

        h1,
        h4,
        h5 {
            font-family: valo;
        }

        .hero {
            position: relative;
            overflow: hidden;
            border-radius: 0.5rem;
        }

        /* giant outlined name behind the portrait */
        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: valo;
            font-size: clamp(4rem, 16vw, 13rem);
            letter-spacing: 0.05em;
            color: transparent;
            -webkit-text-stroke: 2px rgba(255, 255, 255, 0.25);
            white-space: nowrap;
            pointer-events: none;
            user-select: none;
        }

        .portrait {
            position: relative;
            z-index: 1;
            max-height: 560px;
            filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.6));
        }

        .info-panel {
            position: relative;
            z-index: 1;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(8px);
            border-radius: 0.5rem;
        }

        .ability-card {
            background-color: rgba(255, 255, 255, 0.06);
            border-radius: 0.5rem;
            transition: transform 0.2s, background-color 0.2s;
        }

        .ability-card:hover {
            transform: translateY(-4px);
            background-color: rgba(255, 255, 255, 0.12);
        }

        .key-badge {
            font-family: valo;
            min-width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.25rem;
            color: #000;
            font-size: 0.9rem;
        }
    </style>
</head>

<body class="p-4 p-lg-5 text-white">
    <a href="javascript:history.back()" class="btn btn-outline-light mb-4" style="width: auto;">&larr; Back</a>

    <div id="agent-view"></div>

    <script>
        var elView = document.getElementById("agent-view");

        var params = new URLSearchParams(window.location.search);
        var id = params.get("id");

        var clean = function (t) { return t.replace(/<\/?[a-z]+>/gi, ""); };

        var roleColors = {
            Duelist: '#ff4655',
            Initiator: '#f5a623',
            Controller: '#a855f7',
            Sentinel: '#2dd4bf'
        };

        // keybinds of skills
        var slotKeys = {
            Grenade: 'C',
            Ability1: 'Q',
            Ability2: 'E',
            Ultimate: 'X',
            Passive: 'Passive'
        };

        const getAgent = async () => {
            const response = await fetch('https://valorant-api.com/v1/agents/' + id);
            const result = await response.json();
            const agent = result.data;

            var image = agent.bustPortrait;
            var name = agent.displayName;
            var role = agent.role.displayName;
            var roleIcon = agent.role.displayIcon;
            var roleColor = roleColors[role] || '#ffffff';
            var bg = agent.background;
            var colors = agent.backgroundGradientColors;
            var gradient = 'linear-gradient(135deg, #' + colors[0] + ', #' + colors[1] + ')';

            document.title = name;

            var abilities = '';
            for (var i = 0; i < agent.abilities.length; i++) {
                var ab = agent.abilities[i];
                var abName = ab.displayName;
                var key = slotKeys[ab.slot] || '?';
                var icon = ab.displayIcon
                    ? '<img src="' + ab.displayIcon + '" style="width: 48px; height: 48px; object-fit: contain;" alt="' + abName + '">'
                    : '';

                abilities += `
                <div class="col-12 col-md-6">
                    <div class="ability-card p-3 h-100" style="border-left: 4px solid ` + roleColor + `;">
                        <div class="d-flex align-items-center mb-2">
                            ` + icon + `
                            <div class="fw-bold ms-3 me-auto">` + abName + `</div>
                            <span class="key-badge p-2" style="background-color: ` + roleColor + `;">` + key + `</span>
                        </div>
                        <div class="small text-white-50">` + clean(ab.description) + `</div>
                    </div>
                </div>
                `;
            }

            elView.innerHTML = `
            <div class="hero mb-5" style="background-image: url('` + gradient + `); background-size: cover; background-position: center; border: 2px solid ` + roleColor + `; box-shadow: 0 0 30px ` + roleColor + `55;">
                <div class="watermark">` + name.toUpperCase() + `</div>
                <div class="row g-0 align-items-end">
                    <div class="col-12 col-lg-6 text-center">
                        <img src="` + image + `" class="portrait img-fluid" alt="` + name + `">
                    </div>
                    <div class="col-12 col-lg-6 p-3 p-lg-5">
                        <div class="info-panel p-4">
                            <div class="d-flex align-items-center mb-3">
                                <img src="` + roleIcon + `" style="width: 32px; filter: drop-shadow(0 0 4px ` + roleColor + `);" class="me-2" alt="` + role + `">
                                <span class="fw-bold text-uppercase" style="color: ` + roleColor + `; letter-spacing: 0.15em;">` + role + `</span>
                            </div>
                            <h1 class="display-3 mb-3">` + name + `</h1>
                            <p class="mb-0" style="border-left: 3px solid ` + roleColor + `; padding-left: 1rem;">` + agent.description + `</p>
                        </div>
                    </div>
                </div>
            </div>

            <h4 class="mb-4" style="letter-spacing: 0.1em;">ABILITIES</h4>
            <div class="row g-3">
                ` + abilities + `
            </div>
            `;
        };

        getAgent();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
