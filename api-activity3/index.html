<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>API Genshin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
</head>
<style>
    .btn-purple {
        --bs-btn-color: #fff;
        --bs-btn-bg: #8b5cf6;
        --bs-btn-border-color: #8b5cf6;

        --bs-btn-hover-color: #fff;
        --bs-btn-hover-bg: #7c3aed;
        --bs-btn-hover-border-color: #7c3aed;

        --bs-btn-active-color: #fff;
        --bs-btn-active-bg: #6d28d9;
        --bs-btn-active-border-color: #6d28d9;
    }


    .btn-azure {
        --bs-btn-color: #fff;
        --bs-btn-bg: #00A6A6;
        --bs-btn-border-color: #00A6A6;

        --bs-btn-hover-color: #fff;
        --bs-btn-hover-bg: #008B8B;
        --bs-btn-hover-border-color: #008B8B;

        --bs-btn-active-color: #fff;
        --bs-btn-active-bg: #007373;
        --bs-btn-active-border-color: #007373;
    }

    .btn {
        width: 70px;
    }
</style>

<body class="p-5">
    <div class="container">
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <img src="assets/paimon-menu-icon.png" style="width: 50px;">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" data-bs-toggle="pill" data-bs-target="#pills-characters"
                                type="button" role="tab"><i class="bi bi-house-fill me-1"></i>Characters</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" data-bs-toggle="pill" data-bs-target="#pills-weapons" type="button"
                                role="tab"><i class="bi bi-lightning-charge-fill me-1"></i>Weapons</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" data-bs-toggle="pill" data-bs-target="#pills-artifacts"
                                type="button" role="tab"><i class="bi bi-controller me-1"></i>Artifacts</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" data-bs-toggle="pill" data-bs-target="#pills-achievements"
                                type="button" role="tab"><i class="bi bi-trophy-fill me-1"></i>Achievements</button>
                        </li>
                    </ul>
                    <form class="d-flex" role="search">
                        <input class="form-control me-2" type="search" id="search-input" placeholder="Search"
                            aria-label="Search" />
                    </form>
                </div>
            </div>
        </nav>
    </div>
    <main class="tab-content">
        <section class="tab-pane fade" id="pills-characters" role="tabpanel" tabindex="0">
            <div class="row my-3 text-start">
                <div class="col">
                    <button type=button class="btn bg-light" id="all-btn">All</button>
                    <button type=button class="btn bg-danger text-white" id="pyro-btn">
                        <img src="assets/pyro-icon.png" style="width: 30px;" class="d-block mx-auto">
                        <span>Pyro</span>
                    </button>
                    <button type=button class="btn bg-info" id="cryo-btn">
                        <img src="assets/cryo-icon.png" style="width: 30px;" class="d-block mx-auto">
                        <span>Cryo</span>
                    </button>
                    <button type=button class="btn btn-purple" id="electro-btn">
                        <img src="assets/electro-icon.png" style="width: 30px;" class="d-block mx-auto">
                        <span>Electro</span>
                    </button>
                    <button type=button class="btn bg-success text-white" id="dendro-btn">
                        <img src="assets/dendro-icon.png" style="width: 30px;" class="d-block mx-auto">
                        <span>Dendro</span>
                    </button>
                    <button type=button class="btn btn-azure" id="anemo-btn">
                        <img src="assets/anemo-icon.png" style="width: 30px;" class="d-block mx-auto">
                        <span>Anemo</span>
                    </button>
                    <button type=button class="btn bg-warning" id="geo-btn">
                        <img src="assets/geo-icon.png" style="width: 30px;" class="d-block mx-auto">
                        <span>Geo</span>
                    </button>
                    <button type=button class="btn bg-primary text-white" id="hydro-btn">
                        <img src="assets/hydro-icon.png" style="width: 30px;" class="d-block mx-auto">
                        <span>Hydro</span>
                    </button>
                </div>
            </div>
            <div class="row">
                <div class="col d-flex flex-wrap justify-content-start" id="card_parent">
                </div>
            </div>
        </section>
        <section class="tab-pane fade" id="pills-weapons" role="tabpanel" tabindex="0">

        </section>
        <section class="tab-pane fade" id="pills-artifacts" role="tabpanel" tabindex="0">

        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script>

        const API_URL = "https://genshin.jmp.blue";

        const elCardParent = document.getElementById("card_parent");
        const elAllBtn = document.getElementById("all-btn");
        const elPyroBtn = document.getElementById("pyro-btn");
        const elElectroBtn = document.getElementById("electro-btn");
        const elHydroBtn = document.getElementById("hydro-btn");
        const elDendroBtn = document.getElementById("dendro-btn");
        const elAnemoBtn = document.getElementById("anemo-btn");
        const elGeoBtn = document.getElementById("geo-btn");
        const elCryoBtn = document.getElementById("cryo-btn");

        //Navigation Buttons
        document.querySelectorAll('[data-goto]').forEach(btn => {
            btn.addEventListener('click', () => {
                const tab = document.querySelector(`[data-bs-target="${btn.dataset.goto}"]`);
                bootstrap.Tab.getOrCreateInstance(tab).show();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        });

        function capitalizeFirstLetter(str) {
            if (!str) return str;
            return str.charAt(0).toUpperCase() + str.slice(1);
        }

        function renderCharacters(characters) {
            elCardParent.innerHTML = "";

            for (const id of characters) {
                elCardParent.innerHTML += `
            <div class="card p-2 m-2" style="width: 15rem;">
                <img src="${API_URL}/characters/${id}/icon-big" alt="${id}">
                <div class="card-body">
                    <h5 class="card-title">${capitalizeFirstLetter(id.replaceAll("-", " "))}</h5>
                </div>
            </div>
        `;
            }
        }

        //Character Buttons

        elAllBtn.addEventListener("click", async () => {
            try {
                const res = await fetch(`${API_URL}/characters`);
                const data = await res.json();
                renderCharacters(data);
            } catch (err) {
                console.error(err);
            }
        });

        elPyroBtn.addEventListener("click", async () => {
            try {
                const res = await fetch(`${API_URL}/characters`);
                const ids = await res.json();

                const details = await Promise.all(
                    ids.map(async id => {
                        const r = await fetch(`${API_URL}/characters/${id}`);
                        const char = await r.json();
                        return { id, vision: char.vision };
                    })
                );

                const pyroIds = details
                    .filter(char => char.vision === "Pyro")
                    .map(char => char.id);

                renderCharacters(pyroIds);
            } catch (err) {
                console.error(err);
            }
        });

        elHydroBtn.addEventListener("click", async () => {
            try {
                const res = await fetch(`${API_URL}/characters`);
                const ids = await res.json();

                const details = await Promise.all(
                    ids.map(async id => {
                        const r = await fetch(`${API_URL}/characters/${id}`);
                        const char = await r.json();
                        return { id, vision: char.vision };
                    })
                );

                const hydroIds = details
                    .filter(char => char.vision === "Hydro")
                    .map(char => char.id);

                renderCharacters(hydroIds);
            } catch (err) {
                console.error(err);
            }
        });

        elDendroBtn.addEventListener("click", async () => {
            try {
                const res = await fetch(`${API_URL}/characters`);
                const ids = await res.json();

                const details = await Promise.all(
                    ids.map(async id => {
                        const r = await fetch(`${API_URL}/characters/${id}`);
                        const char = await r.json();
                        return { id, vision: char.vision };
                    })
                );

                const dendroIds = details
                    .filter(char => char.vision === "Dendro")
                    .map(char => char.id);

                renderCharacters(dendroIds);
            } catch (err) {
                console.error(err);
            }
        });

        elAnemoBtn.addEventListener("click", async () => {
            try {
                const res = await fetch(`${API_URL}/characters`);
                const ids = await res.json();

                const details = await Promise.all(
                    ids.map(async id => {
                        const r = await fetch(`${API_URL}/characters/${id}`);
                        const char = await r.json();
                        return { id, vision: char.vision };
                    })
                );

                const anemoIds = details
                    .filter(char => char.vision === "Anemo")
                    .map(char => char.id);

                renderCharacters(anemoIds);
            } catch (err) {
                console.error(err);
            }
        });

        elElectroBtn.addEventListener("click", async () => {
            try {
                const res = await fetch(`${API_URL}/characters`);
                const ids = await res.json();

                const details = await Promise.all(
                    ids.map(async id => {
                        const r = await fetch(`${API_URL}/characters/${id}`);
                        const char = await r.json();
                        return { id, vision: char.vision };
                    })
                );

                const electroIds = details
                    .filter(char => char.vision === "Electro")
                    .map(char => char.id);

                renderCharacters(electroIds);
            } catch (err) {
                console.error(err);
            }
        });

        elCryoBtn.addEventListener("click", async () => {
            try {
                const res = await fetch(`${API_URL}/characters`);
                const ids = await res.json();

                const details = await Promise.all(
                    ids.map(async id => {
                        const r = await fetch(`${API_URL}/characters/${id}`);
                        const char = await r.json();
                        return { id, vision: char.vision };
                    })
                );

                const cryoIds = details
                    .filter(char => char.vision === "Cryo")
                    .map(char => char.id);

                renderCharacters(cryoIds);
            } catch (err) {
                console.error(err);
            }
        });

        elGeoBtn.addEventListener("click", async () => {
            try {
                const res = await fetch(`${API_URL}/characters`);
                const ids = await res.json();

                const details = await Promise.all(
                    ids.map(async id => {
                        const r = await fetch(`${API_URL}/characters/${id}`);
                        const char = await r.json();
                        return { id, vision: char.vision };
                    })
                );

                const geoIds = details
                    .filter(char => char.vision === "Geo")
                    .map(char => char.id);

                renderCharacters(geoIds);
            } catch (err) {
                console.error(err);
            }
        });

        const elSearch = document.getElementById("search-input");

        let allIds = [];

        elSearch.addEventListener("input", async () => {
            try {
                if (!allIds.length) {
                    const res = await fetch(`${API_URL}/characters`);
                    allIds = await res.json();
                }

                const keyword = elSearch.value.trim().toLowerCase().replaceAll(" ", "-");

                const results = allIds.filter(id => id.includes(keyword));

                renderCharacters(results);
            } catch (err) {
                console.error(err);
            }
        });


    </script>
</body>

</html>
