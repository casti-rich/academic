<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>API Valorant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<style>
    @font-face {
        font-family: valo;
        src: url(assets/Valorant\ Font.ttf);
    }

    body {
        background-color: rgb(0, 24, 14);
    }

    h5 {
        font-family: valo;
    }

    .btn-purple {

        --bs-btn-color: #fff;
        --bs-btn-bg: #8b5cf6;
        --bs-btn-border-color: #8b5cf6;

        --bs-btn-hover-color: #fff;
        --bs-btn-hover-bg: #7c3aed;
        --bs-btn-hover-border-color: #7c3aed;

        --bs-btn-active-color: #fff;
        --bs-btn-active-bg: #6d28d9;
        --bs-btn-active-border-color: #6d28d9;
    }


    .btn-azure {
        --bs-btn-color: #fff;
        --bs-btn-bg: #00A6A6;
        --bs-btn-border-color: #00A6A6;

        --bs-btn-hover-color: #fff;
        --bs-btn-hover-bg: #008B8B;
        --bs-btn-hover-border-color: #008B8B;

        --bs-btn-active-color: #fff;
        --bs-btn-active-bg: #007373;
        --bs-btn-active-border-color: #007373;
    }

    .btn {
        width: 70px;
    }
</style>

<body class="p-5">
    <div class="container-fluid" role="tablist">
        <nav class="navbar navbar-expand-lg bg-transparent rounded"
            style="background-color: rgba(255,255,255,0.08); backdrop-filter: blur(8px); outline: 2px solid #ff4655; outline-offset: 4px;">
            <div class="container-fluid">
                <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#pills-home" type="button"
                    role="tab">
                    <img src="assets/V_Logomark_Red.png" style="width: 50px;">
                </button>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link text-white" data-bs-toggle="pill" data-bs-target="#pills-agents"
                                type="button" role="tab"><i class="bi bi-house-fill me-1 "></i>Agents</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link text-white" data-bs-toggle="pill" data-bs-target="#pills-guns"
                                type="button" role="tab"><i class="bi bi-lightning-charge-fill me-1"></i>Guns</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link text-white" data-bs-toggle="pill" data-bs-target="#pills-gamemodes"
                                type="button" role="tab"><i class="bi bi-controller me-1"></i>Gamemodes</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link text-white" data-bs-toggle="pill" data-bs-target="#pills-skins"
                                type="button" role="tab"><i class="bi bi-trophy-fill me-1"></i>Skins</button>
                        </li>
                    </ul>
                    <form class="d-flex" role="search">
                        <input class="form-control me-2" type="search" id="search-input" placeholder="Search"
                            aria-label="Search" />
                    </form>
                </div>
            </div>
        </nav>
    </div>
    <div class="container-fluid pt-4">
        <main class="tab-content">
            <section class="tab-pane fade show active text-white" id="pills-home" role="tabpanel" tabindex="0">
                <div class="min-vh-100 d-flex flex-column justify-content-center align-items-center text-center p-4">
                    <img src="assets/V_Logomark_Red.png" alt="Valorant logo" style="width: 90px;" class="mb-4">
                    <h1>VALORANT</h1>
                    <p class="lead text-secondary mb-5 text-white">Browse agents, guns, gamemodes and skins.</p>
                    <small class="text-secondary mt-5 text-white">Data from valorant-api.com</small>
                </div>
            </section>
            <section class="tab-pane fade" id="pills-agents" role="tabpanel" tabindex="0">
                <div class="row d-flex flex-wrap justify-content-start" id="card-parent">

                </div>
                <div>
                    <nav class="d-flex justify-content-center">
                        <ul class="pagination">
                            <li class="page-item"><a class="page-link" onclick="prevAgent()">Previous</a></li>
                            <li class="page-item"><a class="page-link" id="agentpage">1</a></li>
                            <li class="page-item"><a class="page-link" onclick="nextAgent()">Next</a></li>
                        </ul>
                    </nav>
                </div>
            </section>
            <section class="tab-pane fade" id="pills-gamemodes" role="tabpanel" tabindex="0">
                <div class="d-flex flex-wrap justify-content-start" id="gamemode-parent"></div>
                <nav class="d-flex justify-content-center">
                    <ul class="pagination">
                        <li class="page-item"><a class="page-link" onclick="changePage('agents', -1)">Previous</a></li>
                        <li class="page-item"><a class="page-link" id="page-agents">1</a></li>
                        <li class="page-item"><a class="page-link" onclick="changePage('agents', 1)">Next</a></li>
                    </ul>
                </nav>
            </section>
            <section class="tab-pane fade" id="pills-skins" role="tabpanel" tabindex="0">
                <div class="d-flex flex-wrap justify-content-start" id="skin-parent"></div>
                <nav class="d-flex justify-content-center">
                    <ul class="pagination">
                        <li class="page-item"><a class="page-link" onclick="prevSkin()">Previous</a></li>
                        <li class="page-item"><a class="page-link" id="skinpage">1</a></li>
                        <li class="page-item"><a class="page-link" onclick="nextSkin()">Next</a></li>
                    </ul>
                </nav>
            </section>
            <section class="tab-pane fade" id="pills-guns" role="tabpanel" tabindex="0">
                <div class="d-flex flex-wrap justify-content-start" id="guns-parent"></div>
                <nav class="d-flex justify-content-center">
                    <ul class="pagination">
                        <li class="page-item"><a class="page-link" onclick="changePage('agents', -1)">Previous</a></li>
                        <li class="page-item"><a class="page-link" id="page-agents">1</a></li>
                        <li class="page-item"><a class="page-link" onclick="changePage('agents', 1)">Next</a></li>
                    </ul>
                </nav>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script>
    // element initializations
    var elParent = document.getElementById("card-parent")
    var elGamemodes = document.getElementById("gamemode-parent");
    var elSkins = document.getElementById("skin-parent");

    var urlParams = new URLSearchParams(window.location.search);
    var perPage = 10;

    // agents
    var agentPage = parseInt(urlParams.get('agentPage')) || 1;
    var agentFinalPage = 1;

    const getAgents = async () => {
        elParent.innerHTML = '';
        document.getElementById('agentpage').innerHTML = agentPage;

        const response = await fetch('https://valorant-api.com/v1/agents?isPlayableCharacter=true');
        const result = await response.json();
        const agents = result.data;

        agentFinalPage = Math.ceil(agents.length / perPage);

        var start = (agentPage - 1) * perPage;
        var end = Math.min(agentPage * perPage, agents.length);

        for (var i = start; i < end; i++) {

            var id = agents[i].uuid;
            var image = agents[i].displayIcon;
            var name = agents[i].displayName;
            var role = agents[i].role.displayName;
            var bg = agents[i].background
            var colors = agents[i].backgroundGradientColors;
            var gradient = 'linear-gradient(135deg, #' + colors[0] + ', #' + colors[1] + ')';

            elParent.innerHTML += `
            <div class="card m-2 p-3" style="width: 36rem; background-image:`+ gradient + `; background-size: cover; background-position: center;">
                <div class="row g-0 align-items-center">
                        <div class="col-5">
                            <a href="view.html?id=`+ id + `&page=` + agentPage + `"><img src="` + image + `" class="img-fluid rounded-start" alt="` + name + `"></a>
                        </div> 
                    <div class="col-7">
                        <div class="card-body">
                          <h5 class="card-title text-white">`+ name + `</h5>
                          <p class="card-text text-white">`+ role + `</p>
                        </div>
                    </div>
                </div>
            </div>
            `;
        }
    };

    function prevAgent() {
        agentPage -= 1;
        if (agentPage < 1) agentPage = agentFinalPage;
        getAgents();
    }

    function nextAgent() {
        agentPage += 1;
        if (agentPage > agentFinalPage) agentPage = 1;
        getAgents();
    }

    // game mode
    const getGamemodes = async () => {
        elGamemodes.innerHTML = '';

        const response = await fetch('https://valorant-api.com/v1/gamemodes');
        const result = await response.json();
        const gamemodes = result.data;

        for (var i = 0; i < gamemodes.length; i++) {

            var image = gamemodes[i].displayIcon;
            var name = gamemodes[i].displayName;

            if (!image) continue; 

            elGamemodes.innerHTML += `
                <div class="card m-2 p-3 text-white text-center" style="width: 15rem; background-color: rgba(255,255,255,0.08);">
                    <img src="` + image + `" class="img-fluid mx-auto" style="width: 80px;" alt="` + name + `">
                    <div class="card-body">
                        <h5 class="card-title">` + name + `</h5>
                    </div>
                </div>
            `;
        }
    };

    // skin bundles
    var skinPage = parseInt(urlParams.get('skinPage')) || 1;
    var skinFinalPage = 1;

    const getSkins = async () => {
        elSkins.innerHTML = '';
        document.getElementById('skinpage').innerHTML = skinPage;

        const response = await fetch('https://valorant-api.com/v1/bundles');
        const result = await response.json();
        const bundles = result.data.filter(b => b.displayIcon); 

        skinFinalPage = Math.ceil(bundles.length / perPage);

        var start = (skinPage - 1) * perPage;
        var end = Math.min(skinPage * perPage, bundles.length);

        var cards = '';

        for (var i = start; i < end; i++) {

            var image = bundles[i].displayIcon;
            var name = bundles[i].displayName;
            var id = bundles[i].uuid;

            cards += `
            <a href="weapon_view.html?id=` + id + `&page=` + skinPage + `" class="text-decoration-none">
                <div class="card m-2 p-3 text-white text-center" style="width: 20rem; background-color: rgba(255,255,255,0.08);">
                    <div class="d-flex align-items-center justify-content-center" style="height: 300px;">
                        <img src="` + image + `" class="img-fluid" style="max-height: 400px;" loading="lazy" alt="` + name + `">
                    </div>
                    <div class="card-body">
                        <h5 class="card-title">` + name + `</h5>
                    </div>
                </div>
            </a>`;
        }

        elSkins.innerHTML = cards;
    };

    function prevSkin() {
        skinPage -= 1;
        if (skinPage < 1) skinPage = skinFinalPage;
        getSkins();
    }

    function nextSkin() {
        skinPage += 1;
        if (skinPage > skinFinalPage) skinPage = 1;
        getSkins();
    }

    // ---------- START ----------
    getAgents();
    getGamemodes();
    getSkins();

    document.querySelectorAll('[data-bs-toggle="pill"]').forEach(btn => {
        btn.addEventListener('shown.bs.tab', e => {
            history.replaceState(null, '', e.target.dataset.bsTarget);
        });
    });

    if (location.hash) {
        const btn = document.querySelector(`[data-bs-target="${location.hash}"]`);
        if (btn) bootstrap.Tab.getOrCreateInstance(btn).show();
    }

</script>
</body>

</html>
