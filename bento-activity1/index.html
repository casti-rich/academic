<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Black Clover</title>
    <link rel="icon" href="assets/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css" />
    <style>
        body {
            background-image: url(assets/bg_pc.jpeg);
            background-repeat: no-repeat;
            background-position: center top;
            background-repeat: no-repeat;
            background-size: cover;
        }

        @font-face {
            font-family: Clover;
            src: url(assets/BlackCloverFont.ttf);
        }

        @font-face {
            font-family: CloverFont;
            src: url(assets/fonts/Fraunces-Italic-VariableFont_SOFT\,WONK\,opsz\,wght.ttf);
        }

        .card {
            min-height: 100px;
            border-color: maroon;
        }

        .glass-nav {
            width: 300px;
            padding: .5rem 1.5rem;
            border-radius: 1rem;
            background: rgba(255, 255, 255, 0.25) !important;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        #ytCarousel .carousel-item {
            position: relative;
        }

        #ytCarousel iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        #loader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0b0d;
            transition: opacity .5s;
        }

        #loader.hide {
            opacity: 0;
            pointer-events: none;
        }

        #loader img {
            height: auto;
            max-width: 80vw;
        }

        #loader img {
            animation: pulse 1.2s ease-in-out infinite;
        }

        @keyframes pulse {
            50% {
                opacity: .4;
                transform: scale(.95);
            }
        }
    </style>


</head>


<body>
    <div id="loader">
        <img src="assets/loading_point.png" alt="Loading" style="width: 50px;">
    </div>
    <nav class="navbar glass-nav mx-auto mt-3">
        <div class="container justify-content-center">
            <img src="assets/loading_point.png" style="height: 30px; width: 30px; object-fit: cover;">
        </div>
    </nav>
    <div class="container bg-primary-dark">
        <div class="row g-2">
            <div class="col-12 col-sm-6 g-2">
                <div class="card bg-secondary mt-2" style="height: 406px; border-radius: 1rem 1rem 1rem 1rem;">
                    <div id="ytCarousel" class="carousel slide h-100" data-bs-ride="carousel" data-bs-interval="5000">
                        <div class="carousel-inner h-100">
                            <div class="carousel-item active h-100">
                                <iframe src="https://www.youtube.com/embed/9QyiEgv33z4"
                                    style="width: 100%; height: 100%; border: 0; border-radius: 1rem 1rem 1rem 1rem;"
                                    title="Video 1" allowfullscreen></iframe>
                            </div>
                            <div class="carousel-item h-100">
                                <iframe src="https://www.youtube.com/embed/PtBmc0oFIx4"
                                    style="width: 100%; height: 100%; border: 0; border-radius: 1rem 1rem 1rem 1rem;"
                                    title="Video 2" allowfullscreen></iframe>
                            </div>
                            <div class="carousel-item h-100">
                                <iframe src="https://www.youtube.com/embed/umzOm3846cA"
                                    style="width: 100%; height: 100%; border: 0; border-radius: 1rem 1rem 1rem 1rem;"
                                    title="Video 2" allowfullscreen></iframe>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-12 col-sm-6">
                <div class="card bg-secondary mt-2" style="height: 200px">
                    <img src="assets/yamitonacht.png"
                        style="height: 100%; width: 100%; object-fit: cover; object-position: top; border-radius: 1rem 1rem 1rem 1rem; ">
                    <div class="card-img-overlay">
                        <h2 class="card-title mb-0 text-black" style="font-family: CloverFont;">Black Clover Returns!
                        </h2>
                        <h4 class="text-black" style="font-family: CloverFont;">October 3, 2026!</h4>
                    </div>
                </div>
                <div class="card bg-secondary mt-2" style="height: 200px; border-radius: 1rem 1rem 1rem 10rem;">
                    <img src="assets/thesquad.png"
                        style="height: 100%; width: 100%; object-fit: cover; object-position: top; border-radius: 1rem 1rem 1rem 1rem; ">
                </div>
            </div>
        </div>
        <div class="row g-2">
            <div class="col-12 g-1">
                <div class="card bg-secondary mt-2" style=" height: 100px">
                    <img src="assets/ft_bg_top.jpeg"
                        style="height: 100%; width: 100%; object-fit: cover; object-position: middle; border-radius: 1rem 1rem 1rem 1rem; ">
                    <div class="card-img-overlay">
                        <h2 class="card-title mb-0 text-white" style="font-family: CloverFont; color: white;">My Magic
                            is Never Giving Up!</h1>
                    </div>
                </div>
            </div>
        </div>
        <div class="row g-2">
            <div class="col-6 col-md-4 g-2">
                <div class="card bg-secondary mt-2 rounded-0"
                    style=" height: 406px; border-radius: 1rem 1rem 1rem 1rem;">
                    <img src="assets/asta_cover.jpg"
                        style="height: 100%; width: 100%; object-fit: cover; object-position: middle; border-radius: 1rem 1rem 1rem 1rem; ">
                </div>
            </div>
            <div class="col-6 col-md-4 g-2">
                <div class="card bg-secondary mt-2" style=" height: 406px; border-radius: 1rem 1rem 1rem 1rem;">

                    <img src="assets/yuno_cover.jpg"
                        style="height: 100%; width: 100%; object-fit: cover; object-position: middle; border-radius: 1rem 1rem 1rem 1rem; ">
                </div>
            </div>
            <div class="col-12 col-md-4 g-2">
                <div class="row g-2">
                    <div class="col-12 col-sm-12 g-0 mt-2">
                        <div class="card bg-secondary mt-2 border-0" style=" height: 200px">
                            <img src="assets/noelle.png"
                                style="height: 100%; width: 100%; object-fit: cover; object-position: middle; border-radius: 1rem 1rem 1rem 1rem; ">
                        </div>
                    </div>
                </div>
                <div class="row g-2">
                    <div class="col-12 col-sm-12">
                        <div class="card bg-secondary mt-2" style=" height: 200px">
                            <img src="assets/asta_wing.png"
                                style="height: 100%; width: 100%; object-fit: cover; object-position: middle; border-radius: 1rem 1rem 1rem 1rem; ">
                            <div class="card-img-overlay">
                                <h3 class="card-title mb-0 text-white" style="font-family: CloverFont; color: white;">
                                    Authored by: Yūki Tabata</h3>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <div class="card bg-secondary mt-2">
                    <img src="assets/bg_pc.jpeg"
                        style="height: 100px; width: 100%; object-fit: cover; object-position: middle; border-radius: 1rem 1rem 1rem 1rem;"
                        </img>
                    <div class="card-img-overlay">
                        <h1 class="card-title mb-0 text-white" style="font-family: CloverFont; color: white;">
                            Manga Volumes
                        </h1>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-3">
                <div class="card bg-secondary mt-2">
                    <img src="assets/comic32.jpeg"></img>
                </div>
            </div>
            <div class="col-3">
                <div class="card bg-secondary mt-2">
                    <img src="assets/comic24.jpeg"></img>
                </div>
            </div>
            <div class="col-3">
                <div class="card bg-secondary mt-2">
                    <img src="assets/comic26.jpeg"></img>
                </div>
            </div>
            <div class="col-3">
                <div class="card bg-secondary mt-2">
                    <img src="assets/comic27.jpeg"></img>
                </div>
            </div>
            <div class="col-3">
                <div class="card bg-secondary mt-2">
                    <img src="assets/comic33.jpeg"></img>
                </div>
            </div>
            <div class="col-3">
                <div class="card bg-secondary mt-2">
                    <img src="assets/comic29.jpeg"></img>
                </div>
            </div>
            <div class="col-3">
                <div class="card bg-secondary mt-2">
                    <img src="assets/comic31.jpeg"></img>
                </div>
            </div>
            <div class="col-3">
                <div class="card bg-secondary mt-2">
                    <img src="assets/comic23.jpeg"></img>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center py-4 mt-4 px-3"
        style="background: #1a1a1a; color: #d9d9d9; border-top: 3px solid #691102ab; font-size: clamp(0.65rem, 2.5vw, 0.875rem);">
        <p class="mb-1" style="color: #f5c542; font-weight: 600;">This is a fan-made website and is not official.</p>
        <p class="mb-0">Black Clover and all related characters, images, and videos belong to their respective owners
            (Yūki Tabata, Shueisha, TV Tokyo, Pierrot).</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
    <script>
        window.addEventListener('load', () => {
            document.getElementById('loader').classList.add('hide');
        });
    </script>
</body>

</html>
