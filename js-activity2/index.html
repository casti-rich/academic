<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Genshin Showcase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <Style>
        .card {
            border-color: rgb(247, 150, 223);
            justify-content: center;
            background: linear-gradient(135deg, rgba(253, 160, 160, 0.25), rgba(250, 170, 170, 0.05));
            backdrop-filter: blur(12px) saturate(180%);
            -webkit-backdrop-filter: blur(5px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.35);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.5),
                inset 0 -1px 0 rgba(255, 255, 255, 0.1),
                0 8px 32px rgba(0, 0, 0, 0.2);
            color: #fff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
        }

        .container {
            background: linear-gradient(rgb(0, 80, 155), rgba(0, 121, 10));
        }

        .card-body {
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.5) transparent;
        }

        body {
            background-image: url(assets/spaceship.jpg);
            background-repeat: no-repeat;
            background-position: center top;
            background-repeat: no-repeat;
            background-size: cover;
        }
    </Style>
</head>

<body>
    <div class="container p-3 p-md-5" id="parent">
        <!--content-->
    </div>

        crossorigin="anonymous"></script>
    <script>

                        <div class="col-6 col-md-3"><div class="card rounded-0" style="min-height: 69px;"><div class="p text-center">${c.Elemental_Mastery}</div></div></div>
                        <div class="col-6 col-md-3"><div class="card rounded-0" style="min-height: 69px;"><div class="p text-center">Incoming Healing Bonus:</div></div></div>

</body>

</html>
